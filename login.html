<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Signup | Event Planner</title>
  <link href="https://fonts.googleapis.com/css?family=Jost:400,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fef6f9;
      --primary: #ff4081;
      --secondary: #bc477b;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Jost', sans-serif;
    }

    .auth-container {
      background: #fff;
      box-shadow: 0 6px 40px rgba(255, 50, 150, 0.10);
      border-radius: 18px;
      max-width: 370px;
      width: 100%;
      padding: 2.5rem 2rem 2rem 2rem;
    }

    .auth-tabs {
      display: flex;
      justify-content: center;
      gap: 1.4rem;
      margin-bottom: 2rem;
    }

    .auth-tabs button {
      background: none;
      border: none;
      font-size: 1.14rem;
      font-weight: bold;
      color: var(--secondary);
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 3px solid transparent;
      transition: border-color 0.21s, color 0.19s;
    }

    .auth-tabs button.active {
      color: var(--primary);
      border-color: var(--primary);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.1rem;
    }

    .auth-form input {
      padding: 0.84em 1em;
      border-radius: 12px;
      border: 1.5px solid #e1bee7;
      font-size: 1rem;
    }

    .auth-form button[type="submit"] {
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: bold;
      border-radius: 24px;
      padding: 0.7em 0;
      font-size: 1.15rem;
      cursor: pointer;
      transition: background 0.18s;
      margin-top: 4px;
    }

    .auth-form button[type="submit"]:hover {
      background: var(--secondary);
    }

    .form-desc {
      text-align: center;
      color: #bc9154;
      margin-bottom: 0.7rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form" action="index.html" method="POST">

      <div class="form-desc">Login to your event planner account</div>
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="auth-form" action="signup.php" method="POST" style="display: none;">
      <div class="form-desc">Create a new account</div>
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="password" name="confirmpassword" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script>
    function showLogin() {
      document.getElementById('loginForm').style.display = 'flex';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('signupTab').classList.remove('active');
    }

    function showSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'flex';
      document.getElementById('signupTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
    }
  </script>

</body>
</html>
